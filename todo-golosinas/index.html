            <a href="#" id="logo-link" className="flex items-center gap-2 group">
              <span className="w-9 h-9 rounded-full bg-brand flex items-center justify-center group-hover:scale-110 transition-transform duration-200 shrink-0 shadow-md">

              <div className="leading-tight">
                <div className="font-display text-lg sm:text-xl font-black text-ink tracking-tight leading-none">TODO GOLOSINAS</div>

            </a>

            <nav className="hidden md:flex items-center gap-8">
              <a href="#inicio" className="text-sm font-semibold text-ink/70 hover:text-brand transition-colors duration-150">Inicio</a>
              <a href="#productos" className="text-sm font-semibold text-ink/70 hover:text-brand transition-colors duration-150">Productos</a>
              <a href="#ofertas-semana" className="text-sm font-semibold text-ink/70 hover:text-brand transition-colors duration-150">Ofertas</a>
              <a href="#nosotros" className="text-sm font-semibold text-ink/70 hover:text-brand transition-colors duration-150">Nosotros</a>
            </nav>

            <div className="flex items-center gap-2 sm:gap-3">
              <button id="login-open-btn" onClick={onLoginClick}

                aria-label="Iniciar Sesión">
                <svg xmlns="http://www.w3.org/2000/svg" className="w-4 h-4 text-ink/70" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                  <path strokeLinecap="round" strokeLinejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
                <span className="hidden sm:block text-xs font-semibold">Ingresar</span>
              </button>

              <button id="cart-open-btn" onClick={onCartOpen}
                className="relative flex items-center gap-1.5 sm:gap-2 bg-brand text-white px-3.5 sm:px-4 py-2 rounded-full hover:bg-brand-dark transition-all duration-200 shadow-md shadow-brand/20"
                aria-label={`Abrir carrito, ${cartCount} articulos`}>
                <svg xmlns="http://www.w3.org/2000/svg" className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                  <path strokeLinecap="round" strokeLinejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
                </svg>
                <span className="text-xs sm:text-sm font-semibold">Carrito</span>
                <AnimatePresence>
                  {cartCount > 0 && (
                    <motion.span key="badge" id="cart-badge"
                      initial={{ scale:0 }} animate={{ scale:1 }} exit={{ scale:0 }}
                      className="absolute -top-1.5 -right-1.5 sm:-top-2 sm:-right-2 w-5 h-5 rounded-full bg-accent text-ink text-[10px] font-bold flex items-center justify-center shadow">
                      {cartCount}
                    </motion.span>
                  )}
                </AnimatePresence>
              </button>

              <button id="mobile-menu-toggle" onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                className="md:hidden p-2 text-ink hover:text-brand focus:outline-none" aria-label="Abrir menu movil">
                <svg xmlns="http://www.w3.org/2000/svg" className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                  {mobileMenuOpen ? (
                    <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />

          <AnimatePresence>
            {mobileMenuOpen && (
              <motion.nav initial={{ height:0, opacity:0 }} animate={{ height:'auto', opacity:1 }} exit={{ height:0, opacity:0 }}
                className="md:hidden bg-surface border-t border-gray-100 px-4 py-4 flex flex-col gap-3 shadow-lg">
                <a href="#inicio" onClick={() => setMobileMenuOpen(false)} className="text-base font-semibold text-ink hover:text-brand py-1 px-2 rounded-lg hover:bg-pink-50 transition-colors">Inicio</a>
                <a href="#productos" onClick={() => setMobileMenuOpen(false)} className="text-base font-semibold text-ink hover:text-brand py-1 px-2 rounded-lg hover:bg-pink-50 transition-colors">Productos</a>
                <a href="#ofertas-semana" onClick={() => setMobileMenuOpen(false)} className="text-base font-semibold text-ink hover:text-brand py-1 px-2 rounded-lg hover:bg-pink-50 transition-colors">Ofertas</a>
                <a href="#nosotros" onClick={() => setMobileMenuOpen(false)} className="text-base font-semibold text-ink hover:text-brand py-1 px-2 rounded-lg hover:bg-pink-50 transition-colors">Nosotros</a>
                <button onClick={() => { setMobileMenuOpen(false); onLoginClick(); }} className="text-base font-semibold text-brand text-left py-1 px-2 rounded-lg hover:bg-pink-50 transition-colors">
                  Iniciar Sesión
                </button>
              </motion.nav>
            )}
          </AnimatePresence>
        </header>
      );
    }

    /* ─── PARALLAX ITEM ─── */
    function ParallaxItem({ item, mouseX, mouseY }) {
      const delays = { h1:0.2, h2:0.35, h3:0.5, h4:0.65, h5:0.8 };
      const x = useTransform(mouseX, v => v * item.depth * -1);
      const y = useTransform(mouseY, v => v * item.depth * -1);
      const sx = useSpring(x, { stiffness:75, damping:18 });
      const sy = useSpring(y, { stiffness:75, damping:18 });
      return (
        <motion.div className={`absolute pointer-events-none select-none ${item.cls}`}
          style={{ x:sx, y:sy, zIndex:item.z, rotate:item.rotate }}
          initial={{ opacity:0, scale:0.8 }} animate={{ opacity:1, scale:1 }}
          transition={{ duration:0.7, delay:delays[item.id]||0.3, ease:[0.16,1,0.3,1] }}>
          <img src={item.src} alt="" loading="eager"
            className="w-full h-full object-cover rounded-xl shadow-lg ring-2 ring-white/50" />
        </motion.div>
      );
    }

    /* ─── HERO ─── */
    function Hero({ onShopNow }) {
      const ref = useRef(null);
      const mouseX = useMotionValue(0);
      const mouseY = useMotionValue(0);
      const onMove = useCallback(e => {
        const r = ref.current?.getBoundingClientRect();
        if (!r) return;
        mouseX.set(e.clientX - r.left - r.width / 2);
        mouseY.set(e.clientY - r.top - r.height / 2);
      }, []);
      const onLeave = useCallback(() => { mouseX.set(0); mouseY.set(0); }, []);

      return (
        <section id="inicio" ref={ref} onMouseMove={onMove} onMouseLeave={onLeave}
          className="relative bg-gradient-to-br from-brand/15 via-accent/25 to-purple/15 pt-28 pb-16 md:py-24 flex items-center overflow-hidden">
          <div className="absolute inset-0 hero-grid-bg opacity-10 pointer-events-none" />
          {HERO_ITEMS.map(item => (
            <ParallaxItem key={item.id} item={item} mouseX={mouseX} mouseY={mouseY} />
          ))}
          <div className="relative z-20 max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <motion.div initial={{ opacity:0, y:16 }} animate={{ opacity:1, y:0 }} transition={{ delay:0.1, duration:0.5 }}
              className="inline-block bg-brand/10 text-brand px-4 py-1.5 rounded-full text-xs font-bold tracking-wider uppercase mb-4 shadow-sm border border-brand/20">
              Famailla, Tucuman &middot; Desde 2008
            </motion.div>
            <motion.h1 initial={{ opacity:0, y:30 }} animate={{ opacity:1, y:0 }}
              transition={{ delay:0.2, duration:0.7, ease:[0.16,1,0.3,1] }}
              className="font-display font-black text-ink leading-[0.95] tracking-tight uppercase"
              style={{ fontSize:'clamp(2.5rem,7.5vw,5.5rem)' }}>
              BIENVENIDO A <br />
              <span className="text-brand drop-shadow-sm">TODO GOLOSINAS</span>
            </motion.h1>
            <motion.p initial={{ opacity:0, y:20 }} animate={{ opacity:1, y:0 }} transition={{ delay:0.4, duration:0.5 }}
              className="mt-5 max-w-md mx-auto text-base md:text-lg text-ink/80 font-medium leading-relaxed">
              Golosinas y snacks seleccionados al mejor precio. Venta mayorista y minorista con envios a todo el pais.
            </motion.p>
            <motion.div initial={{ opacity:0, y:20 }} animate={{ opacity:1, y:0 }} transition={{ delay:0.55, duration:0.5 }}
              className="mt-8 flex flex-col sm:flex-row gap-3.5 justify-center">
              <button id="hero-shop-btn" onClick={onShopNow}
                className="bg-brand text-white px-7 py-3 rounded-full font-semibold text-base hover:bg-brand-dark active:scale-95 transition-all duration-200 shadow-lg shadow-brand/30">
                Ver todos los productos
              </button>
              <a href="#ofertas-semana" id="hero-offers-btn"
                className="bg-white/80 backdrop-blur-sm border-2 border-brand text-brand px-7 py-3 rounded-full font-semibold text-base hover:bg-brand hover:text-white active:scale-95 transition-all duration-200 shadow-sm">
                Ofertas de hoy
              </a>
            </motion.div>
          </div>
        </section>
      );

    /* ─── STATS BAND ─── */
    function StatsBand() {
      return (
        <section className="bg-purple py-10 shadow-inner">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-2 md:grid-cols-4 gap-6 text-center">
            {[{v:'+5.000',l:'Clientes satisfechos'},{v:'200+',l:'Productos disponibles'},{v:'24hs',l:'Despacho garantizado'},{v:'15 anos',l:'En el mercado'}].map(({v,l}) => (
              <div key={l}>
                <div className="font-display font-black text-accent leading-none" style={{fontSize:'clamp(2.2rem,5vw,3.2rem)'}}>{v}</div>
                <div className="mt-1 text-xs text-white/80 font-semibold tracking-wide">{l}</div>
              </div>
            ))}
          </div>
        </section>
      );
    }

    /* ─── PRODUCT CARD ─── */
    function ProductCard({ product, onAdd }) {
      const [adding, setAdding] = useState(false);
      const isOut = product.inStock === false;
      const handle = () => { 
        if (isOut) return;
        setAdding(true); 
        onAdd(product); 
        setTimeout(() => setAdding(false), 700); 
      };
      return (
        <motion.article id={`product-${product.id}`} layout
          initial={{ opacity:0, y:24 }} animate={{ opacity:1, y:0 }} exit={{ opacity:0, scale:0.95 }}
          transition={{ duration:0.28 }}
          className="bg-surface rounded-2xl overflow-hidden flex flex-col shadow-sm border border-gray-100 hover:shadow-xl hover:border-brand/20 transition-all duration-300 group">
          <div className="relative overflow-hidden bg-pink-50/50 aspect-square">
            <img src={product.img} alt={product.name} loading="lazy"
              className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
            {product.badge && (
              <span className="absolute top-3 left-3 bg-brand text-white text-[9px] font-display font-black tracking-widest uppercase px-2.5 py-1 rounded-full shadow-md">
                {product.badge}
              </span>
            )}
            {isOut && (
              <div className="absolute inset-0 bg-white/60 backdrop-blur-[2px] flex items-center justify-center">
                <span className="bg-ink text-white font-display font-black text-sm tracking-widest uppercase px-4 py-1.5 rounded-full shadow-lg rotate-12">
                  Agotado
                </span>
              </div>
            )}
          </div>
          <div className="p-5 flex flex-col flex-1">
            <p className="text-[10px] font-bold text-brand uppercase tracking-widest mb-1">{product.category}</p>
            <h3 className="font-display font-bold text-xl text-ink leading-tight mb-1">{product.name}</h3>
            <p className="text-xs text-ink-muted mb-4">{product.unit}</p>
            <div className="mt-auto flex items-end justify-between gap-3">
              <div>
                <div className="font-bold text-xl text-ink">{fmt(product.price)}</div>
                {product.oldPrice && <div className="text-xs text-ink-muted line-through">{fmt(product.oldPrice)}</div>}
              </div>
              <button id={`add-to-cart-${product.id}`} onClick={handle} disabled={isOut}
                className={`shrink-0 flex items-center gap-1.5 px-4 py-2.5 rounded-full font-semibold text-sm transition-all duration-200 active:scale-95 shadow-sm ${isOut ? 'bg-gray-200 text-gray-400 cursor-not-allowed' : adding ? 'bg-emerald-500 text-white' : 'bg-brand text-white hover:bg-brand-dark'}`}
                aria-label={isOut ? `Producto agotado` : `Agregar ${product.name} al carrito`}>
                {isOut ? (
                  <>Agotado</>
                ) : adding ? (
                  <><svg xmlns="http://www.w3.org/2000/svg" className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={3}><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"/></svg>Listo!</>
                ) : (
                  <><svg xmlns="http://www.w3.org/2000/svg" className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4"/></svg>Agregar</>
                )}
              </button>
            </div>
          </div>
        </motion.article>
      );
    }

    /* ─── PRODUCT GRID — DESTACADOS ─── */
    function ProductGrid({ products, onAdd }) {
      const [cat, setCat] = useState('Todos');
      const all = cat === 'Todos' ? products : products.filter(p => p.category === cat);
      const featured = all.filter(p => p.isFeatured).slice(0, 8);
      return (
        <section id="productos" className="py-20 bg-bg">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="mb-10">
              <p className="text-xs font-bold tracking-[0.2em] uppercase text-brand mb-2">Selección especial</p>
              <h2 className="font-display font-black text-ink leading-none tracking-tight" style={{fontSize:'clamp(2rem,5.5vw,3.8rem)'}}>
                ARTÍCULOS DESTACADOS <span className="text-brand">DE LA SEMANA</span>
              </h2>
            </div>
            <div id="category-filter" className="flex items-center gap-2 mb-10 overflow-x-auto pb-2 scrollbar-none sm:flex-wrap">
              {CATEGORIES.map(c => (
                <button key={c} id={`cat-${c.toLowerCase()}`} onClick={() => setCat(c)}
                  className={`shrink-0 px-4 py-2 rounded-full text-xs sm:text-sm font-semibold transition-all duration-200 ${cat === c ? 'bg-brand text-white shadow-md shadow-brand/20' : 'bg-surface text-ink hover:bg-brand/10 border border-pink-100'}`}>
                  {c}
                </button>
              ))}
            </div>
            <motion.div layout className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
              <AnimatePresence mode="popLayout">
                {featured.map(p => <ProductCard key={p.id} product={p} onAdd={onAdd} />)}
              </AnimatePresence>
            </motion.div>
          </div>
        </section>
      );
    }

    /* ─── OFFERS GRID — OFERTAS DE LA SEMANA ─── */
    function OffersGrid({ products, onAdd }) {
      const offers = products.filter(p => p.isOffer).slice(0, 8);
      return (
        <section id="ofertas-semana" className="py-20 bg-gradient-to-b from-bg to-pink-50/50">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="mb-10 text-center">
              <p className="text-xs font-bold tracking-[0.2em] uppercase text-brand mb-2">Precios imperdibles</p>
              <h2 className="font-display font-black text-ink leading-none tracking-tight" style={{fontSize:'clamp(2rem,5.5vw,3.8rem)'}}>
                OFERTAS <span className="text-brand">DE LA SEMANA</span>
              </h2>
              <p className="mt-3 text-ink-muted text-sm max-w-md mx-auto">Aprovechá los mejores descuentos en golosinas seleccionadas. ¡Stock limitado!</p>
            </div>
            <motion.div layout className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
              <AnimatePresence mode="popLayout">
                {offers.map(p => <ProductCard key={p.id} product={{...p, badge: p.badge || 'OFERTA'}} onAdd={onAdd} />)}
              </AnimatePresence>
            </motion.div>
          </div>
        </section>
      );
    }

    /* ─── SHIPPING BANNER ─── */
    function OfferBanner() {
      return (
        <section id="ofertas" className="bg-gradient-to-r from-purple via-brand to-purple py-16 overflow-hidden relative shadow-lg">
          <div className="absolute -top-24 -right-24 w-80 h-80 rounded-full bg-accent/20 blur-3xl pointer-events-none" />
          <div className="absolute -bottom-24 -left-24 w-80 h-80 rounded-full bg-accent/20 blur-3xl pointer-events-none" />
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row items-center justify-between gap-8 relative z-10">
            <div>
              <span className="inline-block bg-accent text-ink font-display font-black text-xs tracking-widest uppercase px-3.5 py-1 rounded-full mb-3 shadow-md">
                🚚 Envío gratis
              </span>

    /* ─── CART DRAWER ─── */
    function CartDrawer({ isOpen, cart, onClose, onRemove, onQty }) {
      const subtotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
      
      // Lógica de Cupón
      const [couponInput, setCouponInput] = useState('');
      const [appliedCoupon, setAppliedCoupon] = useState(null);
      const [couponError, setCouponError] = useState('');

      // Descuentos hardcodeados de ejemplo
      const validCoupons = {
        'PROMO10': { type: 'percent', value: 10 },
        'GOLOSINAS20': { type: 'percent', value: 20 },
        'ENVIOFREE': { type: 'fixed', value: 1500 }
      };

      const handleApplyCoupon = () => {
        const code = couponInput.trim().toUpperCase();
        if (!code) return;
        
        if (validCoupons[code]) {
          setAppliedCoupon({ code, ...validCoupons[code] });
          setCouponError('');
        } else {
          setAppliedCoupon(null);
          setCouponError('Cupón inválido');
        }
      };

      const handleRemoveCoupon = () => {
        setAppliedCoupon(null);
        setCouponInput('');
        setCouponError('');
      };

      // Cálculo de total con descuento
      let discountAmount = 0;
      if (appliedCoupon) {
        if (appliedCoupon.type === 'percent') {
          discountAmount = subtotal * (appliedCoupon.value / 100);
        } else if (appliedCoupon.type === 'fixed') {
          discountAmount = appliedCoupon.value;
        }
      }
      
      const total = Math.max(0, subtotal - discountAmount);

      useEffect(() => {
        document.body.style.overflow = isOpen ? 'hidden' : '';
        return () => { document.body.style.overflow = ''; };
      }, [isOpen]);

      const handleWhatsAppCheckout = () => {
        if (cart.length === 0) return;
        
        let message = "Hola Todo Golosinas, quiero pedir:\n";
        cart.forEach(item => {
          message += `- ${item.qty}x ${item.name} (${fmt(item.price * item.qty)})\n`;
        });
        
        message += `\nSubtotal: ${fmt(subtotal)}`;
        if (appliedCoupon) {
          message += `\nCupón aplicado (${appliedCoupon.code}): -${fmt(discountAmount)}`;
        }
        message += `\n*Total a pagar: ${fmt(total)}*`;

        const encodedMessage = encodeURIComponent(message);
        const whatsappNumber = "5493816096311";
        window.open(`https://wa.me/${whatsappNumber}?text=${encodedMessage}`, "_blank");
      };

      return (
        <AnimatePresence>
          {isOpen && (
            <>
              <motion.div key="overlay" id="cart-overlay"

                    <h2 className="font-display font-black text-2xl text-ink tracking-tight">TU CARRITO</h2>

                    </svg>
                  </button>
                </div>
                
                <div className="flex-1 overflow-y-auto px-6">
                  {cart.length === 0 ? (
                    <div className="flex flex-col items-center justify-center h-full text-center py-20">
                      <div className="w-20 h-20 rounded-full bg-gray-50 flex items-center justify-center mb-5">
                        <svg xmlns="http://www.w3.org/2000/svg" className="w-9 h-9 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
                        </svg>
                      </div>
                      <p className="font-display font-bold text-xl text-ink mb-2">Carrito vacío</p>
                      <button onClick={onClose} className="bg-brand text-white font-semibold px-6 py-3 rounded-full hover:bg-brand-dark transition-colors text-sm shadow-md">
                        Explorar productos

                    </div>
                  ) : (
                    <AnimatePresence>
                      {cart.map(item => <CartItem key={item.id} item={item} onRemove={onRemove} onQty={onQty} />)}
                    </AnimatePresence>
                  )}
                </div>

                {cart.length > 0 && (
                  <div className="px-6 py-6 border-t border-gray-100 bg-surface/95 backdrop-blur-sm">
                    {/* Sección Cupón */}
                    <div className="mb-5 pb-5 border-b border-gray-100 border-dashed">
                      {!appliedCoupon ? (
                        <div>
                          <label className="block text-xs font-bold text-ink uppercase tracking-wider mb-2">¿Tenés un cupón?</label>
                          <div className="flex gap-2">
                            <input type="text" value={couponInput} onChange={e => {setCouponInput(e.target.value); setCouponError('');}}
                              className="flex-1 bg-gray-50 border border-gray-200 text-ink text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-brand"
                              placeholder="Ej: PROMO10" />
                            <button onClick={handleApplyCoupon} className="bg-ink text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-black transition-colors">
                              Aplicar
                            </button>
                          </div>
                          {couponError && <p className="text-xs text-red-500 font-semibold mt-1.5">{couponError}</p>}
                        </div>
                      ) : (
                        <div className="flex items-center justify-between bg-emerald-50 border border-emerald-100 px-4 py-3 rounded-lg">
                          <div className="flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5 text-emerald-500" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clipRule="evenodd" /></svg>
                            <div>
                              <p className="text-xs font-bold text-emerald-700">Cupón aplicado: {appliedCoupon.code}</p>
                              <p className="text-[10px] text-emerald-600 font-medium">-{fmt(discountAmount)} descuento</p>
                            </div>
                          </div>
                          <button onClick={handleRemoveCoupon} className="text-xs font-semibold text-emerald-700 hover:text-emerald-900 underline">Quitar</button>
                        </div>
                      )}
                    </div>

                    {/* Resumen Totales */}
                    <div className="flex justify-between items-baseline mb-1">
                      <span className="text-sm text-ink-muted font-medium">Subtotal</span>
                      <span className="font-semibold text-lg text-ink">{fmt(subtotal)}</span>
                    </div>
                    {appliedCoupon && (
                      <div className="flex justify-between items-baseline mb-1 text-emerald-600">
                        <span className="text-sm font-medium">Descuento</span>
                        <span className="font-semibold text-lg">-{fmt(discountAmount)}</span>
                      </div>
                    )}
                    <div className="flex justify-between items-baseline mb-1 mt-2">
                      <span className="text-sm text-ink font-bold uppercase tracking-wide">Total a Pagar</span>
                      <span className="font-black text-2xl text-brand">{fmt(total)}</span>
                    </div>
                    
                    <p className="text-[10px] text-ink-muted mb-5 text-right">Envío calculado en WhatsApp.</p>
                    
                    <button id="checkout-btn" onClick={handleWhatsAppCheckout}
                      className="flex items-center justify-center gap-2 w-full bg-brand text-white font-bold text-base py-4 rounded-full hover:bg-brand-dark active:scale-[0.98] transition-all duration-200 shadow-lg shadow-brand/25">
                      <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                        <path strokeLinecap="round" strokeLinejoin="round" d="M17 8h2a2 2 0 012 2v6a2 2 0 01-2 2h-2v4l-4-4H9a1.994 1.994 0 01-1.414-.586m0 0L11 14h4a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 002 2v6a2 2 0 002 2h2v4l.586-.586z" />
                      </svg>
                      Pedir por WhatsApp
                    </button>
                    <button onClick={onClose} className="w-full mt-3 text-ink-muted text-sm font-medium hover:text-ink transition-colors py-1">
                      Seguir comprando
                    </button>
                  </div>
                )}
              </motion.aside>
            </>
          )}
        </AnimatePresence>
      );
    }

    /* ─── ADMIN VIEW ─── */
    function AdminView({ products, fetchProducts, onLogout }) {
      const defaultForm = { name: '', price: '', img: '', isFeatured: false, isOffer: false, inStock: true, category: 'Golosinas', unit: 'Unidad' };
      const [form, setForm] = useState(defaultForm);
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingProduct, setEditingProduct] = useState(null);
      const [isSaving, setIsSaving] = useState(false);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'F4') {
            e.preventDefault();
            openModal(null);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      const openModal = (product) => {
        if (product) {
          setEditingProduct(product);
          setForm({
            name: product.name,
            price: product.price,
            img: product.img,
            isFeatured: product.isFeatured || false,
            isOffer: product.isOffer || false,
            inStock: product.inStock !== false,
            category: product.category,
            unit: product.unit
          });
        } else {
          setEditingProduct(null);
          setForm(defaultForm);
        }
        setIsModalOpen(true);
      };

      const closeModal = () => {
        setIsModalOpen(false);
        setEditingProduct(null);
        setForm(defaultForm);
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!form.name || !form.price || !form.img) return alert('Completa nombre, precio e imagen');
        
        setIsSaving(true);
        const productData = {
          ...form,
          oldPrice: form.isOffer ? Number(form.price) * 1.2 : null,
          badge: form.isOffer ? 'OFERTA' : null,
        };

        const dbPayload = mapToSupabase(productData);

        if (editingProduct) {
          const { error } = await supabaseClient.from('products').update(dbPayload).eq('id', editingProduct.id);
          if (error) alert('Error al actualizar: ' + error.message);
          else {
            alert('Producto actualizado exitosamente');
            fetchProducts();
            closeModal();
          }
        } else {
          const { error } = await supabaseClient.from('products').insert([dbPayload]);
          if (error) alert('Error al guardar: ' + error.message);
          else {
            alert('Producto agregado exitosamente');
            fetchProducts();
            closeModal();
          }
        }
        setIsSaving(false);
      };

      const toggleStock = async (id, currentStock) => {
        const { error } = await supabaseClient.from('products').update({ in_stock: !currentStock }).eq('id', id);
        if (error) alert('Error al actualizar stock: ' + error.message);
        else fetchProducts();
      };

      const handleDelete = async (id) => {
        if (window.confirm('¿Estás seguro de que deseas eliminar este producto?')) {
          const { error } = await supabaseClient.from('products').delete().eq('id', id);
          if (error) alert('Error al eliminar: ' + error.message);
          else fetchProducts();
        }
      };

      return (
        <div className="min-h-screen bg-gray-50 pb-20">
          <header className="bg-surface shadow-sm border-b border-gray-200 sticky top-0 z-10">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-8 h-8 bg-ink rounded-lg flex items-center justify-center">
                  <svg xmlns="http://www.w3.org/2000/svg" className="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                </div>
                <h1 className="font-display font-black text-xl text-ink tracking-tight">Panel de Administración</h1>
              </div>
              <button onClick={onLogout} className="text-sm font-semibold text-brand hover:text-brand-dark transition-colors flex items-center gap-1.5">
                <svg xmlns="http://www.w3.org/2000/svg" className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                Salir a tienda
              </button>
            </div>
          </header>

          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8">
            <div className="flex items-center justify-between mb-6">
              <h2 className="font-display font-bold text-2xl text-ink">Catálogo de Productos</h2>
              <button onClick={() => openModal(null)} className="flex items-center gap-2 bg-brand text-white font-bold text-sm px-5 py-2.5 rounded-full hover:bg-brand-dark transition-all shadow-md active:scale-95">
                <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4"/></svg>
                Cargar Nuevo Producto <span className="text-white/60 ml-1 text-xs">(F4)</span>
              </button>
            </div>

            <div className="bg-surface rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
              <div className="px-6 py-4 border-b border-gray-100 bg-gray-50/50">
                <span className="text-sm font-semibold text-ink-muted">Total: {products.length} productos</span>
              </div>
              <div className="overflow-x-auto">
                <table className="w-full text-left text-sm">
                  <thead className="bg-gray-50 text-xs uppercase font-bold tracking-wider text-ink-muted border-b border-gray-100">
                    <tr>
                      <th className="px-6 py-4">Producto</th>
                      <th className="px-6 py-4">Precio</th>
                      <th className="px-6 py-4">Estado</th>
                      <th className="px-6 py-4 text-right">Acciones</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-100">
                    {products.map(p => (
                      <tr key={p.id} className="hover:bg-gray-50 transition-colors group">
                        <td className="px-6 py-4 flex items-center gap-4">
                          <div className="w-12 h-12 rounded-xl overflow-hidden bg-gray-100 shrink-0 border border-gray-200/50 shadow-sm">
                            <img src={p.img} alt={p.name} className="w-full h-full object-cover" />
                          </div>
                          <div>
                            <div className="font-bold text-ink text-base">{p.name}</div>
                            <div className="text-[10px] text-ink-muted uppercase tracking-wider font-semibold">{p.category} • {p.unit}</div>
                          </div>
                        </td>
                        <td className="px-6 py-4 font-bold text-ink text-base">{fmt(p.price)}</td>
                        <td className="px-6 py-4">
                          <div className="flex gap-1.5 flex-wrap">
                            {p.isFeatured && <span className="bg-purple/10 text-purple text-[10px] font-bold px-2.5 py-1 rounded-full border border-purple/20">Destacado</span>}
                            {p.isOffer && <span className="bg-accent/20 text-accent-dark text-[10px] font-bold px-2.5 py-1 rounded-full border border-accent/40">Oferta</span>}
                            {!p.inStock && <span className="bg-red-50 text-red-600 text-[10px] font-bold px-2.5 py-1 rounded-full border border-red-200">Agotado</span>}
                          </div>
                        </td>
                        <td className="px-6 py-4">
                          <div className="flex items-center justify-end gap-2 opacity-80 group-hover:opacity-100 transition-opacity">
                            <button onClick={() => toggleStock(p.id, p.inStock)} title={p.inStock ? "Marcar como Agotado" : "Reponer Stock"}
                              className={`p-2 rounded-lg transition-colors ${p.inStock ? 'text-ink-muted hover:bg-gray-200 hover:text-ink' : 'text-emerald-600 hover:bg-emerald-100'}`}>
                              {p.inStock ? (
                                <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/></svg>
                              ) : (
                                <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"/></svg>
                              )}
                            </button>
                            <button onClick={() => openModal(p)} title="Editar"
                              className="p-2 text-ink-muted hover:bg-gray-200 hover:text-ink rounded-lg transition-colors">
                              <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                            </button>
                            <button onClick={() => handleDelete(p.id)} title="Eliminar"
                              className="p-2 text-red-400 hover:bg-red-50 hover:text-red-600 rounded-lg transition-colors">
                              <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                            </button>
                          </div>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
                {products.length === 0 && (
                  <div className="py-12 text-center text-ink-muted">No hay productos cargados en el catálogo.</div>
                )}
              </div>
            </div>
          </div>

          <AnimatePresence>
            {isModalOpen && (
              <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}
                className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-ink/40 backdrop-blur-sm">
                <motion.div initial={{ scale: 0.95, y: 20 }} animate={{ scale: 1, y: 0 }} exit={{ scale: 0.95, y: 20 }}
                  className="bg-surface w-full max-w-md rounded-3xl shadow-2xl overflow-hidden border border-gray-100">
                  <div className="px-6 py-4 border-b border-gray-100 flex items-center justify-between bg-gray-50/50">
                    <h3 className="font-display font-bold text-xl text-ink">
                      {editingProduct ? 'Editar Producto' : 'Nuevo Producto'}
                    </h3>
                    <button onClick={closeModal} className="p-2 text-ink-muted hover:text-ink hover:bg-gray-200 rounded-full transition-colors">
                      <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                  </div>
                  
                  <div className="p-6">
                    <form onSubmit={handleSubmit} className="flex flex-col gap-4">
                      <div>
                        <label className="block text-xs font-bold text-ink uppercase tracking-wider mb-1.5">Nombre</label>
                        <input type="text" value={form.name} onChange={e => setForm({...form, name: e.target.value})} className="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-brand" placeholder="Ej. Caramelos..." autoFocus />
                      </div>
                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs font-bold text-ink uppercase tracking-wider mb-1.5">Precio ($)</label>
                          <input type="number" value={form.price} onChange={e => setForm({...form, price: e.target.value})} className="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-brand" placeholder="850" />
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-ink uppercase tracking-wider mb-1.5">Categoría</label>
                          <select value={form.category} onChange={e => setForm({...form, category: e.target.value})} className="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-brand">
                            {CATEGORIES.filter(c => c !== 'Todos').map(c => <option key={c} value={c}>{c}</option>)}
                          </select>
                        </div>
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-ink uppercase tracking-wider mb-1.5">URL de Imagen</label>
                        <input type="text" value={form.img} onChange={e => setForm({...form, img: e.target.value})} className="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-brand" placeholder="https://..." />
                      </div>
                      
                      <div className="flex flex-col gap-3 mt-2 border-t border-gray-100 pt-4 bg-gray-50/50 -mx-6 px-6 pb-2">
                        <label className="flex items-center justify-between cursor-pointer group">
                          <span className="text-sm font-semibold text-ink group-hover:text-brand transition-colors">¿Es Destacado?</span>
                          <input type="checkbox" checked={form.isFeatured} onChange={e => setForm({...form, isFeatured: e.target.checked})} className="w-4 h-4 text-brand rounded focus:ring-brand" />
                        </label>
                        <label className="flex items-center justify-between cursor-pointer group">
                          <span className="text-sm font-semibold text-ink group-hover:text-brand transition-colors">¿Es Oferta de la semana?</span>
                          <input type="checkbox" checked={form.isOffer} onChange={e => setForm({...form, isOffer: e.target.checked})} className="w-4 h-4 text-brand rounded focus:ring-brand" />
                        </label>
                        <label className="flex items-center justify-between cursor-pointer group">
                          <span className="text-sm font-semibold text-ink group-hover:text-brand transition-colors">Stock Disponible</span>
                          <input type="checkbox" checked={form.inStock} onChange={e => setForm({...form, inStock: e.target.checked})} className="w-4 h-4 text-brand rounded focus:ring-brand" />
                        </label>
                      </div>

                      <div className="flex gap-3 mt-4">
                        <button type="button" onClick={closeModal} className="flex-1 bg-gray-100 text-ink font-bold text-sm py-3 rounded-xl hover:bg-gray-200 transition-colors">
                          Cancelar
                        </button>
                        <button type="submit" disabled={isSaving} className="flex-1 bg-ink text-white font-bold text-sm py-3 rounded-xl hover:bg-black transition-colors shadow-md disabled:opacity-50">
                          {isSaving ? 'Guardando...' : (editingProduct ? 'Actualizar' : 'Guardar')}
                        </button>
                      </div>
                    </form>
                  </div>
                </motion.div>
              </motion.div>
            )}
          </AnimatePresence>
        </div>
      );
    }

    /* ─── APP ROOT ─── */
    function App() {
      const [currentView, setCurrentView] = useState('store'); // 'store', 'login', 'admin'
      const [products, setProducts] = useState([]);
      const [isLoading, setIsLoading] = useState(true);
      
      const fetchProducts = async () => {
        setIsLoading(true);
        const { data, error } = await supabaseClient.from('products').select('*');
        if (error) {
          console.error('Error fetching products:', error);
        } else if (data) {
          setProducts(data.map(mapToReact));
        }
        setIsLoading(false);
      };

      useEffect(() => {
        fetchProducts();
      }, []);

      const [cart, setCart] = useState([]);
      const [cartOpen, setCartOpen] = useState(false);
      const [toast, setToast] = useState(null);

      const cartCount = cart.reduce((s, i) => s + i.qty, 0);

      const addToCart = useCallback((product) => {
        setCart(prev => {
          const ex = prev.find(i => i.id === product.id);
          return ex ? prev.map(i => i.id === product.id ? {...i, qty:i.qty+1} : i) : [...prev, {...product, qty:1}];
        });
        setToast(product);
      }, []);

      const removeFromCart = useCallback((id) => setCart(prev => prev.filter(i => i.id !== id)), []);

      const changeQty = useCallback((id, qty) => {
        if (qty < 1) return removeFromCart(id);
        setCart(prev => prev.map(i => i.id === id ? {...i, qty} : i));
      }, [removeFromCart]);

      return (
        <>
          <Navbar cartCount={cartCount} onCartOpen={() => setCartOpen(true)} onLoginClick={() => setCurrentView('login')} />
          <main>
            <Hero onShopNow={() => document.getElementById('productos')?.scrollIntoView({ behavior:'smooth' })} />
            <StatsBand />
            <ProductGrid products={products} onAdd={(p) => addToCart(p)} />
            <OffersGrid products={products} onAdd={(p) => addToCart(p)} />
            <OfferBanner />
          </main>
          <Footer />
          <CartDrawer isOpen={cartOpen} cart={cart} onClose={() => setCartOpen(false)} onRemove={removeFromCart} onQty={changeQty} />
          <Toast toast={toast} onClose={() => setToast(null)} />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
